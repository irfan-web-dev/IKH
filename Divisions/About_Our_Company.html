<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Our Company - IKH Groups</title>
    <meta
      name="description"
      content="Learn more about IKH Groups, our mission, and our vision in the construction industry."
    />
    <link rel="icon" type="image/x-icon" href="title_logo.jpeg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
    <style>
      .pdf-container {
        width: 100%;
        height: 700px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        border-radius: 16px;
        overflow: hidden;
      }

      .pdf-container iframe {
        width: 100%;
        height: 100%;
        border: none;
      }

      @media (max-width: 768px) {
        .pdf-container {
          height: 500px;
        }
      }
    </style>
  </head>
  <body>
    <main class="main-content">
      <section class="content-section-template">
        <div class="content-container-template">
          <div class="section-title-template">
            <h2>About Our Company</h2>
          </div>
          <div class="pdf-container">
            <iframe src="E-mail-Profile.pdf"></iframe>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
