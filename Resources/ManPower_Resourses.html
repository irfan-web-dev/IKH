<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manpower Resources - IKH Groups</title>
    <meta
      name="description"
      content="IKH Groups' skilled workforce and manpower resources for construction projects"
    />
    <link rel="icon" type="image/x-icon" href="title_logo.jpeg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <link rel="stylesheet" href="/style.css" />
    <style>
      /*  Hero Section */
      .manpower-hero {
        position: relative;
        background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)),
          url("https://images.unsplash.com/photo-1504328345606-18bbc8c9d7d1?q=80&w=3570&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D")
            no-repeat center center/cover;
        padding: 180px 0 120px;
        text-align: center;
        overflow: hidden;
        display: flex;
        align-items: center;
        min-height: 60vh;
      }
      
      .manpower-hero .container {
        position: relative;
        z-index: 2;
      }

      .manpower-hero h1 {
        font-size: clamp(2.5rem, 5vw, 4.5rem);
        margin-bottom: 1.5rem;
        text-transform: uppercase;
        font-weight: 800;
        letter-spacing: 2px;
        line-height: 1.2;
        text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.6);
        font-family: "Poppins", sans-serif;
        color: var(--white);
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      .manpower-hero p {
        font-size: clamp(1.1rem, 2vw, 1.4rem);
        max-width: 800px;
        margin: 0 auto 2.5rem;
        line-height: 1.6;
        opacity: 0.9;
        color: var(--white);
      }

      /* Single Image Section */
      .single-image-section {
        padding: 6rem 0;
        background-color: #fff;
        position: relative;
      }

      .single-image-section::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxkZWZzPjxwYXR0ZXJuIGlkPSJwYXR0ZXJuIiB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiIHBhdHRlcm5UcmFuc2Zvcm09InJvdGF0ZSg0NSkiPjxyZWN0IHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCIgZmlsbD0icmdiYSgyNDgsMjQ4LDI0OCwxKSI+PC9yZWN0PjxyZWN0IHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCIgZmlsbD0icmdiYSgyNTUsMjU1LDI1NSwxKSIgeD0iMjAiIHk9IjAiPjwvcmVjdD48L3BhdHRlcm4+PC9kZWZzPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9InVybCgjcGF0dGVybikiIG9wYWNpdHk9IjAuMDIiPjwvcmVjdD48L3N2Zz4=");
        opacity: 0.1;
        z-index: 0;
      }

      .single-image-container {
        position: relative;
        z-index: 1;
      }

      .section-title {
        text-align: center;
        margin-bottom: 3rem;
        position: relative;
      }

      .section-title h2 {
        font-size: clamp(1.8rem, 3vw, 2.5rem);
        color: var(--primary);
        position: relative;
        display: inline-block;
        padding-bottom: 1rem;
      }

      .section-title h2::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 80px;
        height: 4px;
        background: var(--primary);
        border-radius: 2px;
      }

      .single-image-wrapper {
        margin: 3rem auto 0;
        max-width: 1000px;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        border: 1px solid rgba(0, 0, 0, 0.05);
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .single-image-wrapper::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          to bottom,
          rgba(249, 115, 22, 0.1),
          transparent
        );
        z-index: 1;
        pointer-events: none;
      }

      .single-image-wrapper:hover {
        transform: translateY(-8px);
        box-shadow: 0 35px 60px -15px rgba(0, 0, 0, 0.2);
      }

      .single-image-wrapper img {
        width: 100%;
        max-width: 100%;
        height: auto;
        display: block;
        transition: transform 0.8s cubic-bezier(0.165, 0.84, 0.44, 1);
        object-fit: cover;
      }

      .single-image-wrapper:hover img {
        transform: scale(1.05);
      }

      /* Responsive Adjustments */
      @media (max-width: 768px) {
        .manpower-hero {
          padding: 120px 0 80px;
          min-height: 60vh;
        }

        .single-image-section {
          padding: 4rem 0;
        }

        .stat-card {
          padding: 2rem 1rem;
        }
      }

      /* Animation classes */
      .animate-on-scroll {
        opacity: 0;
        transition: opacity 0.6s ease, transform 0.6s ease;
      }

      .animate-on-scroll.visible {
        opacity: 1;
      }

      .slide-up {
        transform: translateY(30px);
      }

      .slide-up.visible {
        transform: translateY(0);
      }

      .slide-left {
        transform: translateX(-30px);
      }

      .slide-left.visible {
        transform: translateX(0);
      }

      .slide-right {
        transform: translateX(30px);
      }

      .slide-right.visible {
        transform: translateX(0);
      }

      /* Floating animation for hero text */
      @keyframes float {
        0% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-10px);
        }
        100% {
          transform: translateY(0px);
        }
      }

      .floating {
        animation: float 6s ease-in-out infinite;
      }
    </style>
  </head>

  <body>
    <!-- Main Content -->
    <main class="main-content">
      <!-- Hero Section -->
      <section class="manpower-hero">
        <div class="container floating">
          <h1 class="animate__animated animate__fadeInDown">
            Manpower Resources
          </h1>
          <p class="animate__animated animate__fadeInUp">
            Our highly skilled and dedicated workforce forms the foundation of
            our construction excellence, delivering quality projects on time,
            every time.
          </p>
        </div>
      </section>

      <!-- New Section with Single Image -->
      <section class="single-image-section">
        <div class="container single-image-container">
          <div class="section-title">
            <h2>Our Workforce in Action</h2>
          </div>
          <p
            class="contact-description"
            style="text-align: center; max-width: 800px; margin: 0 auto 2rem"
          ></p>
          <div class="single-image-wrapper animate-on-scroll slide-up">
            <img
              src="../Manpower-Resources.webp"
              alt="IKH Groups Workforce in Action"
              style="width: 100%; height: auto"
            />
          </div>
        </div>
      </section>
    </main>

    <!-- JavaScript -->
    <script src="/IKH/index.js"></script>
    <script>
      // Simple scroll animation trigger
      document.addEventListener("DOMContentLoaded", function () {
        const animateElements = document.querySelectorAll(".animate-on-scroll");

        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add("visible");
              }
            });
          },
          {
            threshold: 0.1,
          }
        );

        animateElements.forEach((element) => {
          observer.observe(element);
        });
      });
    </script>
  </body>
</html>
