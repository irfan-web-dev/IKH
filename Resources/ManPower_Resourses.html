<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manpower Resources - IKH Groups</title>
    <meta
      name="description"
      content="IKH Groups' skilled workforce and manpower resources for construction projects"
    />
    <link rel="icon" type="image/x-icon" href="title_logo.jpeg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <link rel="stylesheet" href="/IKH/style.css" />
    <style>
      .workforce-image-container {
        position: relative;
        overflow: hidden;
        border-radius: 16px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        border: 1px solid rgba(0, 0, 0, 0.05);
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .workforce-image-container::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          to bottom,
          rgba(249, 115, 22, 0.1),
          transparent
        );
        z-index: 1;
        pointer-events: none;
      }

      .workforce-image {
        width: 100%;
        max-width: 100%;
        height: auto;
        display: block;
        transition: transform 0.8s cubic-bezier(0.165, 0.84, 0.44, 1);
        object-fit: cover;
        border-radius: 12px;
      }

      .intro-text {
        text-align: center;
        max-width: 800px;
        margin: 0 auto 2rem;
      }
    </style>
  </head>

  <body>
    <!-- Main Content -->
    <main class="main-content">
      <!-- Hero Section -->
      <section class="hero-section-template">
        <div class="container hero-container">
          <div class="hero-text-content floating">
            <h1 class="animate__animated animate__fadeInDown">
              Manpower Resources
            </h1>
            <p class="animate__animated animate__fadeInUp">
              Our highly skilled and dedicated workforce forms the foundation of
              our construction excellence, delivering quality projects on time,
              every time.
            </p>
          </div>
          <dotlottie-player
            src="https://lottie.host/13c8d285-fdc0-44f6-bf8f-057d7488aae8/GnBkHM3Kq3.lottie"
            background="transparent"
            speed="1"
            style="width: 300px; height: 300px"
            loop
            autoplay
          ></dotlottie-player>
        </div>
      </section>

      <!-- Image Section -->
      <section class="content-section-template">
        <div class="content-container-template">
          <div class="section-title-template">
            <h2>Our Workforce in Action</h2>
          </div>
          <p class="intro-text">
            Our dedicated team of professionals brings expertise and commitment
            to every project.
          </p>
          <div class="content-box-template animate-on-scroll slide-up">
            <div class="workforce-image-container">
              <img
                src="https://i0.wp.com/ikhgroups.com/wp-content/uploads/2020/04/Manpower-Resources.jpg?w=1431&ssl=1"
                alt="IKH Groups Workforce in Action"
                class="workforce-image"
              />
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- JavaScript -->
    <script src="/IKH/index.js"></script>
    <script
      src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs"
      type="module"
    ></script>
  </body>
</html>
